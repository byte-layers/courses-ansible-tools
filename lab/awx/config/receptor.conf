# Configuration du receptor, identique à celle qu'AWX 24.6.1 génère lui-même
# (RECEPTOR_CONFIG_STARTER) : AWX la réécrit au démarrage, autant qu'elle ne change pas.
# Les blocs work-kubernetes ne servent pas ici (pas de cluster) ; seul work-command « local » est utilisé.
- local-only: null
- log-level: info
- node:
    firewallrules:
    - action: reject
      tonode: awx-task
      toservice: control
- control-service:
    filename: /var/run/receptor/receptor.sock
    permissions: '0660'
    service: control
- work-command:
    allowruntimeparams: true
    command: ansible-runner
    params: worker
    worktype: local
- work-signing:
    privatekey: /etc/receptor/work_private_key.pem
    tokenexpiration: 1m
- work-kubernetes:
    allowruntimeauth: true
    allowruntimeparams: true
    allowruntimepod: true
    authmethod: runtime
    worktype: kubernetes-runtime-auth
- work-kubernetes:
    allowruntimeauth: true
    allowruntimeparams: true
    allowruntimepod: true
    authmethod: incluster
    worktype: kubernetes-incluster-auth
- tls-client:
    cert: /etc/receptor/tls/receptor.crt
    key: /etc/receptor/tls/receptor.key
    mintls13: false
    name: tlsclient
    rootcas: /etc/receptor/tls/ca/mesh-CA.crt
